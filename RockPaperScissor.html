<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h2 class="title">Rock Paper Scissors</h2>

<img src="rock.png" alt="Rock" onclick="playGame('rock')" class="js-rock-button  rock">
<img src="paper.png" alt="Paper" onclick="playGame('paper')" class="js-paper-button  paper">
<img src="scissors.png" alt="Scissors" onclick="playGame('scissors')" class="js-scissors-button scissors">

<p class="js-result result"></p>
<p class="js-moves moves"></p>
<p class="js-score score"></p>

<button class="reset" onclick="resetScore()">Reset Score</button>
<button class="autoplay" onclick="autoPlay()">Auto Play</button>

<script src="script.js"></script>

</body>
</html>
